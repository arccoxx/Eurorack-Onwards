<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">Contraction residual</title>
<desc id="d">A stable gain walks toward the target. An unstable gain walks away. A clamp stops at the lattice bounds.</desc>
<rect width="960" height="300" rx="18" fill="#101620"/>
<text x="32" y="42" fill="#f2f6ff" font-family="Georgia, serif" font-size="28">Feedback fixed point, not time travel</text>
<polyline points="80,220 180,180 280,150 380,132 480,122 580,116" fill="none" stroke="#5ee0d0" stroke-width="4"/>
<polyline points="80,220 200,200 340,160 500,90 680,30" fill="none" stroke="#ff6b6b" stroke-width="4"/>
<line x1="60" y1="110" x2="900" y2="110" stroke="#ffb020" stroke-dasharray="6 6"/>
<text x="700" y="100" fill="#ffb020" font-family="ui-sans-serif, sans-serif" font-size="16">target c</text>
<text x="80" y="270" fill="#5ee0d0" font-family="ui-sans-serif, sans-serif" font-size="16">|alpha| &lt; 1 stable</text>
<text x="360" y="270" fill="#ff6b6b" font-family="ui-sans-serif, sans-serif" font-size="16">|alpha| &gt; 1 unstable</text>
<text x="640" y="270" fill="#c5d0e0" font-family="ui-sans-serif, sans-serif" font-size="16">clamp = meet/join bounds</text>
</svg>
